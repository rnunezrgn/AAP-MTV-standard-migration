---
# Fixed copy of the lab playbook (rhpds/ocp-virt playbook.yml and its
# rlopez.ocp_virt roles "providers" and "virt_plan"), flattened into one file.
# Same variables, same steps, same result. Changes from the original are
# marked FIX. The one that matters: when vCenter returns no datastores, the
# original sent MTV an empty StorageMap and failed. This copy then uses the
# StorageMap that already exists under storagemap_name instead.
#
# Credentials on the job template: VMware vCenter and OpenShift API.
# Survey / variables: provider_name, plan_name, storagemap_name,
# networkmap_name, vmware_host, user_selected_vm_names.
- name: Playbook for OpenShift Virt
  hosts: localhost
  gather_facts: false
  vars:
    provider_name: vmware
    provider_namespace: openshift-mtv
    vmware_credentials: vmware-credentials
    migration_namespace: openshift-mtv
    migration_target_namespace: openshift-mtv
    # FIX: only used when vCenter lists no datastores AND no StorageMap named
    # storagemap_name exists yet. Datastore names as MTV shows them.
    source_datastore_names: []
  tasks:
    # ---- role: providers ---------------------------------------------------
    - name: Deploy Provider resource
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: Provider
          metadata:
            name: "{{ provider_name }}"
            namespace: "{{ provider_namespace }}"
          spec:
            secret:
              name: "{{ vmware_credentials }}"
              namespace: "{{ provider_namespace }}"
            settings:
              vddkInitImage: 'image-registry.openshift-image-registry.svc:5000/openshift/vddk:latest'
            type: vsphere
            url: 'https://{{ vmware_host }}/sdk'

    # ---- role: virt_plan ---------------------------------------------------
    - name: Build a list of all the folders
      vmware.vmware_rest.vcenter_folder_info:
      register: all_folders

    - name: Filter VM folders
      ansible.builtin.set_fact:
        vm_folders: "{{ all_folders.value | selectattr('type', 'equalto', 'VIRTUAL_MACHINE') | list }}"

    - name: Check each VM folder for VMs
      vmware.vmware_rest.vcenter_vm_info:
        folders: "{{ item.folder }}"
      register: vm_folders_with_vms
      loop: "{{ vm_folders }}"
      when: vm_folders | length > 0

    - name: Display VM names and IDs
      ansible.builtin.debug:
        msg: "VM Name: {{ item.name }}, VM ID: {{ item.vm }}"
      loop: "{{ vm_folders_with_vms.results | map(attribute='value') | flatten }}"
      when: item | length > 0
      loop_control:
        label: "{{ item.name }}"

    - name: Collect VM names and IDs
      ansible.builtin.set_fact:
        vm_name_id_pairs: "{{ vm_name_id_pairs | default([]) + [{'name': item.name, 'vm': item.vm}] }}"
      loop: "{{ vm_folders_with_vms.results | map(attribute='value') | flatten }}"
      when: item | length > 0

    # FIX: accept names separated by new lines or commas, and as a list.
    - name: Work out the selected VM names
      ansible.builtin.set_fact:
        _selected_vm_names: >-
          {{ (user_selected_vm_names if user_selected_vm_names is not string else
              (user_selected_vm_names | regex_findall('[^,\n\r]+')))
             | map('trim') | reject('equalto', '') | list }}

    - name: Prepare VMs for Plan spec
      ansible.builtin.set_fact:
        vms_for_plan_spec: "{{ vms_for_plan_spec | default([]) + [{'hooks': [], 'id': vm_id.vm}] }}"
      loop: "{{ vm_name_id_pairs | default([]) }}"
      loop_control:
        loop_var: vm_id
      when: vm_id.name in _selected_vm_names

    # FIX: say which names did not match instead of failing later on an undefined variable.
    - name: Every selected VM must exist in vCenter
      ansible.builtin.assert:
        that: vms_for_plan_spec | default([]) | length > 0
        fail_msg: >-
          None of the selected VMs ({{ _selected_vm_names | join(', ') or 'none given' }}) was found in vCenter.
          vCenter has: {{ vm_name_id_pairs | default([]) | map(attribute='name') | join(', ') or 'no VMs visible' }}.
        quiet: true

    - name: Get information for the distributed port group 'segment-migrating-to-ocpvirt'
      vmware.vmware_rest.vcenter_network_info:
        filter_types: DISTRIBUTED_PORTGROUP
      register: my_portgroup

    - name: Capture the distrivuted portgroup id to make network mappings
      ansible.builtin.set_fact:
        portgroup_id: "{{ my_portgroup.value[0].network }}"

    - name: Create or update a NetworkMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: NetworkMap
          metadata:
            name: "{{ networkmap_name }}"
            namespace: "{{ migration_namespace }}"
          spec:
            map:
              - destination:
                  type: pod
                source:
                  id: "{{ portgroup_id }}"
            provider:
              destination:
                name: host
                namespace: "{{ migration_namespace }}"
              source:
                name: vmware
                namespace: "{{ migration_namespace }}"

    - name: Build a list of all the datastores
      vmware.vmware_rest.vcenter_datastore_info:
      register: all_the_datastores

    # FIX: everything from here to "Deploy Virt Plan". The original always
    # rebuilt the StorageMap from this list, also when the list was empty.
    - name: Look for an existing StorageMap with this name
      kubernetes.core.k8s_info:
        api_version: forklift.konveyor.io/v1beta1
        kind: StorageMap
        namespace: "{{ migration_namespace }}"
        name: "{{ storagemap_name }}"
      register: _existing_storagemap

    - name: Decide how to get the StorageMap
      ansible.builtin.set_fact:
        _datastore_ids: "{{ all_the_datastores.value | default([]) | map(attribute='datastore') | list }}"
        _storagemap_mode: >-
          {{ 'vcenter' if (all_the_datastores.value | default([]) | length > 0) else
             ('existing' if ((_existing_storagemap.resources | default([]) | length > 0)
                             and (_existing_storagemap.resources[0].spec.map | default([]) | length > 0)) else
              ('names' if (source_datastore_names | length > 0) else 'none')) }}

    - name: Say which StorageMap is used
      ansible.builtin.debug:
        msg: >-
          {{ {'vcenter': 'vCenter listed ' ~ (_datastore_ids | length) ~ ' datastore(s): building StorageMap ' ~ storagemap_name ~ ' from them',
              'existing': 'vCenter listed no datastores: using the existing StorageMap ' ~ storagemap_name ~ ' as it is',
              'names': 'vCenter listed no datastores: building StorageMap ' ~ storagemap_name ~ ' from source_datastore_names',
              'none': 'vCenter listed no datastores and there is no StorageMap named ' ~ storagemap_name}[_storagemap_mode] }}

    - name: A StorageMap is needed
      ansible.builtin.assert:
        that: _storagemap_mode != 'none'
        fail_msg: >-
          vCenter returned no datastores to this job, and no StorageMap named {{ storagemap_name }}
          exists in {{ migration_namespace }}. Set storagemap_name to an existing StorageMap
          (oc get storagemap -n {{ migration_namespace }}), or set source_datastore_names.
        quiet: true

    - name: Get storage class information
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
      register: storage_classes
      when: _storagemap_mode in ['vcenter', 'names']

    - name: Find default storage class
      ansible.builtin.set_fact:
        default_storage_class: "{{ item.metadata.name }}"
      loop: "{{ storage_classes.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when:
        - _storagemap_mode in ['vcenter', 'names']
        - item.metadata.annotations is defined
        - "'storageclass.kubernetes.io/is-default-class' in item.metadata.annotations"
        - item.metadata.annotations['storageclass.kubernetes.io/is-default-class'] == 'true'

    - name: Print default storage class name
      ansible.builtin.debug:
        msg: "{{ default_storage_class }}"
      when: _storagemap_mode in ['vcenter', 'names']

    - name: Build the storage mapping from the vCenter datastores
      ansible.builtin.set_fact:
        _storage_map: "{{ _storage_map | default([]) + [{'destination': {'storageClass': default_storage_class}, 'source': {'id': item}}] }}"
      loop: "{{ _datastore_ids }}"
      when: _storagemap_mode == 'vcenter'

    - name: Build the storage mapping from source_datastore_names
      ansible.builtin.set_fact:
        _storage_map: "{{ _storage_map | default([]) + [{'destination': {'storageClass': default_storage_class}, 'source': {'name': item}}] }}"
      loop: "{{ source_datastore_names }}"
      when: _storagemap_mode == 'names'

    - name: Create or update a StorageMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: StorageMap
          metadata:
            name: "{{ storagemap_name }}"
            namespace: "{{ migration_namespace }}"
          spec:
            map: "{{ _storage_map }}"
            provider:
              destination:
                name: host
                namespace: "{{ migration_namespace }}"
              source:
                name: vmware
                namespace: "{{ migration_namespace }}"
      when: _storagemap_mode in ['vcenter', 'names']

    - name: Deploy Virt Plan
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: Plan
          metadata:
            name: "{{ plan_name }}"
            namespace: "{{ migration_namespace }}"
          spec:
            archived: false
            description: ''
            map:
              network:
                name: "{{ networkmap_name }}"
                namespace: "{{ migration_namespace }}"
              storage:
                name: "{{ storagemap_name }}"
                namespace: "{{ migration_namespace }}"
            provider:
              destination:
                name: host
                namespace: "{{ migration_namespace }}"
              source:
                name: vmware
                namespace: "{{ migration_namespace }}"
            targetNamespace: "{{ migration_target_namespace }}"
            vms: "{{ vms_for_plan_spec }}"
            warm: false

    - name: Create a Migration manifest to run the Plan CR
      kubernetes.core.k8s:
        api_version: forklift.konveyor.io/v1beta1
        kind: Migration
        namespace: "{{ migration_namespace }}"
        name: "{{ plan_name }}"
        definition:
          metadata:
            name: "{{ plan_name }}"
            namespace: "{{ migration_namespace }}"
          spec:
            plan:
              name: "{{ plan_name }}"
              namespace: "{{ migration_namespace }}"
