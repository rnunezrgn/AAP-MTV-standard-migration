---
- name: Inspect MTV StorageMap CRD
  hosts: localhost
  gather_facts: false

  collections:
    - kubernetes.core

  tasks:

    - name: Get StorageMap CRD
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: storagemaps.forklift.konveyor.io
      register: crd

    - name: Show StorageMap schema
      ansible.builtin.debug:
        msg: "{{ crd.resources[0].spec.versions
          | selectattr('name', 'equalto', 'v1beta1')
          | map(attribute='schema.openAPIV3Schema')
          | list }}"
