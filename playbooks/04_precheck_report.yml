---
# Workflow node 04: go / no-go list and the pre-check report the approver reads.
- name: "04 | Pre-check report and gate"
  hosts: localhost
  gather_facts: false
  roles:
    - mtv_common
  tasks:
    - name: Load decisions
      ansible.builtin.include_role:
        name: mtv_common
        tasks_from: load_run

    - name: Gate
      ansible.builtin.include_role:
        name: mtv_gate

    - name: Pass the selected VM names to later workflow nodes
      ansible.builtin.set_stats:
        data:
          user_selected_vm_names: "{{ mtv_go | join('\n') }}"
          run_id: "{{ mtv_run_id }}"
        per_host: false