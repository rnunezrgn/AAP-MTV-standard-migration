---
# ansible-builder build -t <registry>/ee-mtv-migration:1.0 -f execution-environment.yml
version: 3
images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9:latest
dependencies:
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner
  galaxy: collections/requirements.yml
  python:
    - kubernetes>=24.2.0
    - pyvmomi>=8.0.3
    - pywinrm>=0.4.3
    - requests-ntlm
    - pykerberos
    - jmespath
  system:
    - krb5-devel [platform:rpm]
    - gcc [platform:rpm]
    - python3-devel [platform:rpm]
